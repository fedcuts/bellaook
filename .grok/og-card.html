<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Cormorant Garamond";
    font-style: normal;
    font-weight: 600;
    src: url("fonts/cormorant-latin.woff2") format("woff2");
  }
  @font-face {
    font-family: "Outfit";
    font-style: normal;
    font-weight: 500;
    src: url("fonts/outfit-latin.woff2") format("woff2");
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0c0b0a;
  }
  .stage {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0c0b0a;
  }
  .plate {
    position: absolute;
    top: -30px;
    height: 690px;
    width: 620px;
    object-fit: cover;
    filter: saturate(1.08) contrast(1.06) brightness(0.92);
  }
  .left {
    left: -70px;
    object-position: 62% 58%;
  }
  .right {
    right: -90px;
    width: 680px;
    object-position: 48% 42%;
  }
  .scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg,
        rgba(12,11,10,0.18) 0%,
        rgba(12,11,10,0.05) 16%,
        rgba(12,11,10,0.55) 34%,
        rgba(12,11,10,0.94) 46%,
        #0c0b0a 50%,
        rgba(12,11,10,0.94) 54%,
        rgba(12,11,10,0.5) 68%,
        rgba(12,11,10,0.12) 86%,
        rgba(12,11,10,0.35) 100%),
      linear-gradient(180deg,
        rgba(12,11,10,0.55) 0%,
        rgba(12,11,10,0) 18%,
        rgba(12,11,10,0) 78%,
        rgba(12,11,10,0.62) 100%);
  }
  .lockup {
    position: absolute;
    left: 180px;
    right: 180px;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
    z-index: 2;
  }
  .mark {
    display: block;
    margin: 0 auto 18px;
    width: 36px;
    height: 36px;
  }
  h1 {
    margin: 0;
    font-family: "Cormorant Garamond", "Liberation Serif", serif;
    font-weight: 600;
    font-size: 112px;
    line-height: 0.82;
    letter-spacing: 0.045em;
    color: #f4efe6;
    text-indent: 0.045em;
  }
  .rule {
    width: 56px;
    height: 3px;
    margin: 26px auto 18px;
    background: #ff5a1f;
  }
  p {
    margin: 0;
    font-family: "Outfit", "Liberation Sans", sans-serif;
    font-weight: 500;
    font-size: 20px;
    line-height: 1;
    letter-spacing: 0.46em;
    color: #ff5a1f;
    text-indent: 0.46em;
  }
</style>
</head>
<body>
  <div class="stage">
    <img class="plate left" src="file:///workspace/public/food/hero.jpg" alt="" />
    <img class="plate right" src="file:///workspace/public/food/oven.jpg" alt="" />
    <div class="scrim"></div>
    <div class="lockup">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path fill="#ff5a1f" d="M16 3.2c.7 4.2 3.1 6.6 4.8 9.2 1.9 2.8 3.6 5 3.6 8.4 0 5-3.8 8.8-8.4 8.8S7.6 25.8 7.6 20.8c0-2.8 1.4-5.2 3-7.4.4 1.7 1.5 2.7 2.8 2.7 1.9 0 2.8-1.7 2.8-3.5C16.1 9 16 5.8 16 3.2z"/>
        <path fill="#f4efe6" d="M16.2 15.6c.3 1.7 1.2 2.7 2 3.7.9 1.1 1.6 2.1 1.6 3.4 0 2.1-1.7 3.7-3.8 3.7s-3.8-1.6-3.8-3.7c0-1.1.5-2 1.2-2.8.3.7.8 1.1 1.4 1.1.9 0 1.3-.7 1.3-1.5.1-1.5.1-2.6.1-3.9z"/>
      </svg>
      <h1>XAWAASH</h1>
      <div class="rule"></div>
      <p>FIRE KITCHEN</p>
    </div>
  </div>
</body>
</html>
